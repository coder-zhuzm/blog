<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc"><title id="title">Outbox：数据库提交与消息投递可靠衔接</title><desc id="desc">订单和待发送事件在同一事务写入，由投递器发布到队列，消费者使用事件 ID 幂等处理。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#247b86"/></marker></defs><rect width="1080" height="510" rx="20" fill="#fcfaf5"/><g font-family="system-ui, -apple-system, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"><text x="540" y="48" font-size="28" fill="#18344a" text-anchor="middle">Outbox：数据库提交与消息投递可靠衔接</text><rect x="40" y="90" width="480" height="155" rx="18" fill="#edf5ed" stroke="#247b86" stroke-dasharray="7 5"/><text x="280" y="122" font-size="20" fill="#18344a" text-anchor="middle">同一个数据库事务：一起提交或回滚</text><rect x="65" y="145" width="195" height="75" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="162.5" y="189.5" font-size="20" fill="#18344a" text-anchor="middle">写入订单</text><rect x="300" y="145" width="195" height="75" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="397.5" y="189.5" font-size="20" fill="#18344a" text-anchor="middle">写入 Outbox</text><rect x="610" y="130" width="180" height="85" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="700.0" y="161" font-size="20" fill="#18344a" text-anchor="middle">投递器</text><text x="700.0" y="189" font-size="16" fill="#18344a" text-anchor="middle">读取未发送事件</text><path d="M520 175 L610 175" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="870" y="130" width="165" height="85" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="952.5" y="179.5" font-size="20" fill="#18344a" text-anchor="middle">消息队列</text><path d="M790 175 L870 175" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="870" y="320" width="165" height="85" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="952.5" y="351" font-size="20" fill="#18344a" text-anchor="middle">消费者</text><text x="952.5" y="379" font-size="16" fill="#18344a" text-anchor="middle">按事件 ID 去重</text><path d="M952 215 L952 320" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="590" y="320" width="200" height="85" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="690.0" y="351" font-size="20" fill="#18344a" text-anchor="middle">业务写入</text><text x="690.0" y="379" font-size="16" fill="#18344a" text-anchor="middle">与去重记录同事务</text><path d="M870 362 L790 362" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="310" y="305" font-size="20" fill="#18344a" text-anchor="middle">发布成功后再标记 Outbox 已发送</text><text x="310" y="345" font-size="20" fill="#a43d36" text-anchor="middle">若此时崩溃，事件可能再次发布</text><text x="540" y="468" font-size="20" fill="#18344a" text-anchor="middle">Outbox 保证可靠衔接；重复投递仍需由消费者幂等处理。</text></g></svg>