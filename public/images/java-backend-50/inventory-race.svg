<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="570" viewBox="0 0 1080 570" role="img" aria-labelledby="title desc"><title id="title">并发扣库存：为什么先查后改会超卖</title><desc id="desc">左侧两个请求读取同一旧库存导致超卖，右侧条件更新只允许一个请求扣减成功。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#247b86"/></marker></defs><rect width="1080" height="570" rx="20" fill="#fcfaf5"/><g font-family="system-ui, -apple-system, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"><text x="540" y="48" font-size="28" fill="#18344a" text-anchor="middle">并发扣库存：为什么先查后改会超卖</text><text x="270" y="95" font-size="22" fill="#18344a" text-anchor="middle">先查后改：两个请求都认为有货</text><text x="810" y="95" font-size="22" fill="#18344a" text-anchor="middle">条件更新：由数据库原子裁决</text><rect x="40" y="120" width="460" height="62" rx="14" fill="#fff0d8" stroke="#9eb8c2"/><text x="270.0" y="158.0" font-size="20" fill="#18344a" text-anchor="middle">初始库存 = 1</text><rect x="580" y="120" width="460" height="62" rx="14" fill="#fff0d8" stroke="#9eb8c2"/><text x="810.0" y="158.0" font-size="20" fill="#18344a" text-anchor="middle">初始库存 = 1</text><rect x="45" y="220" width="200" height="80" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="145.0" y="251" font-size="20" fill="#18344a" text-anchor="middle">请求 A 读到 1</text><text x="145.0" y="279" font-size="16" fill="#18344a" text-anchor="middle">决定购买</text><rect x="295" y="220" width="200" height="80" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="395.0" y="251" font-size="20" fill="#18344a" text-anchor="middle">请求 B 读到 1</text><text x="395.0" y="279" font-size="16" fill="#18344a" text-anchor="middle">也决定购买</text><path d="M155 182 L145 220" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M385 182 L395 220" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="45" y="350" width="200" height="80" rx="14" fill="#ffe8e4" stroke="#9eb8c2"/><text x="145.0" y="381" font-size="20" fill="#18344a" text-anchor="middle">A 写回库存 0</text><text x="145.0" y="409" font-size="16" fill="#18344a" text-anchor="middle">订单 A 成功</text><rect x="295" y="350" width="200" height="80" rx="14" fill="#ffe8e4" stroke="#9eb8c2"/><text x="395.0" y="381" font-size="20" fill="#18344a" text-anchor="middle">B 写回库存 0</text><text x="395.0" y="409" font-size="16" fill="#18344a" text-anchor="middle">订单 B 也成功</text><path d="M145 300 L145 350" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M395 300 L395 350" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="270" y="478" font-size="20" fill="#a43d36" text-anchor="middle">结果：库存看似正确，却卖出了两件</text><rect x="600" y="220" width="420" height="80" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="810.0" y="251" font-size="20" fill="#18344a" text-anchor="middle">请求 A 条件扣减</text><text x="810.0" y="279" font-size="16" fill="#18344a" text-anchor="middle">影响 1 行 → 成功</text><path d="M810 182 L810 220" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="600" y="350" width="420" height="80" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="810.0" y="381" font-size="20" fill="#18344a" text-anchor="middle">请求 B 条件扣减</text><text x="810.0" y="409" font-size="16" fill="#18344a" text-anchor="middle">库存不足，影响 0 行 → 失败</text><path d="M810 300 L810 350" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="810.0" y="313.0" font-size="16" fill="#18344a" text-anchor="middle">库存变为 0</text><text x="810" y="478" font-size="18" fill="#18344a" text-anchor="middle">条件：stock &gt;= quantity，且 quantity &gt; 0</text><text x="540" y="535" font-size="18" fill="#18344a" text-anchor="middle">扣库存与写订单仍需放入同一个本地事务；本图假设 A 先成功。</text></g></svg>