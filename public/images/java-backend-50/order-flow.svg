<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">一次下单请求，串起后端核心概念</title><desc id="desc">请求经过网关和订单服务，由数据库提交库存订单与待投递事件，缓存用于查询，消息由后台工作者处理，支付通知单独验签入站。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#247b86"/></marker></defs><rect width="1080" height="630" rx="20" fill="#fcfaf5"/><g font-family="system-ui, -apple-system, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"><text x="540" y="48" font-size="28" fill="#18344a" text-anchor="middle">一次下单请求，串起后端核心概念</text><rect x="30" y="105" width="150" height="80" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="105.0" y="136" font-size="20" fill="#18344a" text-anchor="middle">客户端</text><text x="105.0" y="164" font-size="16" fill="#18344a" text-anchor="middle">请求 ID</text><rect x="250" y="105" width="200" height="80" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="350.0" y="136" font-size="20" fill="#18344a" text-anchor="middle">网关 / 代理</text><text x="350.0" y="164" font-size="16" fill="#18344a" text-anchor="middle">限流、负载均衡</text><rect x="530" y="105" width="230" height="80" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="645.0" y="136" font-size="20" fill="#18344a" text-anchor="middle">Java 订单服务</text><text x="645.0" y="164" font-size="16" fill="#18344a" text-anchor="middle">校验、幂等、事务</text><rect x="850" y="105" width="195" height="80" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="947.5" y="136" font-size="20" fill="#18344a" text-anchor="middle">数据库</text><text x="947.5" y="164" font-size="16" fill="#18344a" text-anchor="middle">库存 + 订单 + Outbox</text><path d="M180 145 L250 145" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M450 145 L530 145" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M760 145 L850 145" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="530" y="300" width="230" height="80" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="645.0" y="331" font-size="20" fill="#18344a" text-anchor="middle">Redis 缓存</text><text x="645.0" y="359" font-size="16" fill="#18344a" text-anchor="middle">用于合适的查询路径</text><path d="M645 185 L645 300" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="645.0" y="230.5" font-size="16" fill="#18344a" text-anchor="middle">查询 / 失效</text><rect x="850" y="300" width="195" height="80" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="947.5" y="331" font-size="20" fill="#18344a" text-anchor="middle">投递器 → MQ</text><text x="947.5" y="359" font-size="16" fill="#18344a" text-anchor="middle">异步事件</text><path d="M947 185 L947 300" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="947.0" y="230.5" font-size="16" fill="#18344a" text-anchor="middle">提交后读取</text><rect x="850" y="460" width="195" height="80" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="947.5" y="491" font-size="20" fill="#18344a" text-anchor="middle">后台 worker</text><text x="947.5" y="519" font-size="16" fill="#18344a" text-anchor="middle">幂等处理、有限重试</text><path d="M947 380 L947 460" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="300" width="420" height="80" rx="14" fill="#fff0d8" stroke="#9eb8c2"/><text x="240.0" y="331" font-size="20" fill="#18344a" text-anchor="middle">支付平台 Webhook</text><text x="240.0" y="359" font-size="16" fill="#18344a" text-anchor="middle">验签 → 校验 → 持久化 → 幂等处理</text><path d="M240 300 V235 H565 V185" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="410" y="490" font-size="18" fill="#18344a" text-anchor="middle">追踪与指标贯穿链路；健康检查与优雅关闭保障运行。</text><text x="540" y="592" font-size="19" fill="#18344a" text-anchor="middle">数据正确性由数据库约束与事务裁决；缓存加速查询，消息推进异步工作。</text></g></svg>