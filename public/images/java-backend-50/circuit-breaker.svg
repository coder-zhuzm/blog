<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="455" viewBox="0 0 1080 455" role="img" aria-labelledby="title desc"><title id="title">断路器：从失败隔离到探测恢复</title><desc id="desc">关闭状态达到失败阈值后打开，等待后半开探测，成功关闭，失败重新打开。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#247b86"/></marker></defs><rect width="1080" height="455" rx="20" fill="#fcfaf5"/><g font-family="system-ui, -apple-system, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"><text x="540" y="48" font-size="28" fill="#18344a" text-anchor="middle">断路器：从失败隔离到探测恢复</text><rect x="45" y="150" width="270" height="100" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="180.0" y="181" font-size="20" fill="#18344a" text-anchor="middle">Closed · 关闭</text><text x="180.0" y="209" font-size="16" fill="#18344a" text-anchor="middle">正常调用并统计结果</text><rect x="405" y="150" width="270" height="100" rx="14" fill="#fff0d8" stroke="#9eb8c2"/><text x="540.0" y="181" font-size="20" fill="#18344a" text-anchor="middle">Open · 打开</text><text x="540.0" y="209" font-size="16" fill="#18344a" text-anchor="middle">快速拒绝，避免持续施压</text><rect x="765" y="150" width="270" height="100" rx="14" fill="#e8f5f2" stroke="#9eb8c2"/><text x="900.0" y="181" font-size="20" fill="#18344a" text-anchor="middle">Half-open · 半开</text><text x="900.0" y="209" font-size="16" fill="#18344a" text-anchor="middle">允许有限数量的探测</text><path d="M315 200 L405 200" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="360.0" y="188.0" font-size="16" fill="#18344a" text-anchor="middle">达到阈值</text><path d="M675 200 L765 200" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="720.0" y="188.0" font-size="16" fill="#18344a" text-anchor="middle">等待结束</text><path d="M900 250 V330 H540 V250" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="720" y="318" font-size="18" fill="#18344a" text-anchor="middle">探测失败：重新打开</text><path d="M900 150 V95 H180 V150" stroke="#247b86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="540" y="84" font-size="18" fill="#18344a" text-anchor="middle">探测满足成功条件：恢复正常调用</text><text x="540" y="405" font-size="20" fill="#18344a" text-anchor="middle">断路器之外，仍需配置调用超时、并发上限和重试预算。</text></g></svg>