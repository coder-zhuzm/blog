<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1020" viewBox="0 0 800 1020" role="img" aria-labelledby="title desc"><title id="title">值传递：引用被复制，对象未被复制</title><desc id="desc">参数先与调用方引用同一个对象，修改字段可见；重绑定参数不会改变调用方变量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#247b86"/></marker></defs><rect width="800" height="1020" rx="20" fill="#fcfaf5"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="40" y="57" font-size="34" fill="#18344a" text-anchor="start" font-weight="700">值传递：引用被复制，对象未被复制</text><text x="40" y="104" font-size="28" fill="#486477" text-anchor="start" font-weight="400">方法调用：change(user)</text><text x="40" y="157" font-size="30" fill="#18344a" text-anchor="start" font-weight="600">① 传参：复制引用值</text><rect x="40" y="184" width="290" height="152" rx="16" fill="#e8f5f2" stroke="#a6bfca" stroke-width="2"/><text x="64" y="228" font-size="28" fill="#18344a" text-anchor="start" font-weight="600">调用方 user</text><text x="64" y="289" font-size="28" fill="#18344a" text-anchor="start" font-weight="600">形参 u（副本）</text><rect x="475" y="184" width="285" height="152" rx="16" fill="#e8f5f2" stroke="#a6bfca" stroke-width="2"/><text x="500" y="228" font-size="26" fill="#18344a" text-anchor="start" font-weight="600">同一个 User 对象</text><text x="500" y="289" font-size="26" fill="#18344a" text-anchor="start" font-weight="400">name = &quot;Tom&quot;</text><path d="M330 222 H468" fill="none" stroke="#247b86" stroke-width="3" marker-end="url(#arrow)"/><path d="M330 283 H405 V252 H468" fill="none" stroke="#247b86" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="397" font-size="30" fill="#18344a" text-anchor="start" font-weight="600">② 改内容：u.name = &quot;Jack&quot;</text><rect x="40" y="425" width="290" height="152" rx="16" fill="#e8f5f2" stroke="#a6bfca" stroke-width="2"/><text x="64" y="469" font-size="28" fill="#18344a" text-anchor="start" font-weight="600">调用方 user</text><text x="64" y="530" font-size="28" fill="#18344a" text-anchor="start" font-weight="600">形参 u（副本）</text><rect x="475" y="425" width="285" height="152" rx="16" fill="#fff0d8" stroke="#a6bfca" stroke-width="2"/><text x="500" y="469" font-size="26" fill="#18344a" text-anchor="start" font-weight="600">仍是同一个对象</text><text x="500" y="530" font-size="26" fill="#18344a" text-anchor="start" font-weight="400">name = &quot;Jack&quot;</text><path d="M330 463 H468" fill="none" stroke="#247b86" stroke-width="3" marker-end="url(#arrow)"/><path d="M330 524 H405 V493 H468" fill="none" stroke="#247b86" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="638" font-size="30" fill="#18344a" text-anchor="start" font-weight="600">③ 改指向：u = new User(&quot;Ann&quot;)</text><rect x="40" y="667" width="290" height="200" rx="16" fill="#e8f5f2" stroke="#a6bfca" stroke-width="2"/><text x="64" y="721" font-size="28" fill="#18344a" text-anchor="start" font-weight="600">调用方 user</text><text x="64" y="818" font-size="26" fill="#18344a" text-anchor="start" font-weight="600">形参 u（重绑定）</text><rect x="475" y="667" width="285" height="85" rx="16" fill="#e8f5f2" stroke="#a6bfca" stroke-width="2"/><text x="500" y="719" font-size="26" fill="#18344a" text-anchor="start" font-weight="400">原对象：&quot;Jack&quot;</text><rect x="475" y="782" width="285" height="85" rx="16" fill="#e9eefb" stroke="#a6bfca" stroke-width="2"/><text x="500" y="834" font-size="26" fill="#18344a" text-anchor="start" font-weight="400">新对象：&quot;Ann&quot;</text><path d="M330 714 H468" fill="none" stroke="#247b86" stroke-width="3" marker-end="url(#arrow)"/><path d="M330 811 H468" fill="none" stroke="#247b86" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="934" font-size="28" fill="#18344a" text-anchor="start" font-weight="600">返回后，调用方 user 仍指向原对象。</text><text x="40" y="981" font-size="26" fill="#486477" text-anchor="start" font-weight="400">传的是引用值的副本，不是调用方变量本身。</text></g></svg>