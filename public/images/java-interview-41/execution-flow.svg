<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1035" viewBox="0 0 800 1035" role="img" aria-labelledby="title desc"><title id="title">从 Java 源码到程序执行</title><desc id="desc">编译阶段生成字节码，运行阶段加载、链接、初始化，解释器与 JIT 配合执行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#247b86"/></marker></defs><rect width="800" height="1035" rx="20" fill="#fcfaf5"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="40" y="57" font-size="34" fill="#18344a" text-anchor="start" font-weight="700">从 Java 源码到程序执行</text><text x="40" y="103" font-size="28" fill="#486477" text-anchor="start" font-weight="400">01 / 编译期：由开发与构建环境完成</text><rect x="40" y="130" width="720" height="126" rx="16" fill="#e8f5f2" stroke="#a6bfca" stroke-width="2"/><text x="70" y="174" font-size="30" fill="#18344a" text-anchor="start" font-weight="600">Hello.java  源代码</text><text x="70" y="222" font-size="28" fill="#18344a" text-anchor="start" font-weight="400">javac → Hello.class  平台无关字节码</text><path d="M400 256 V309" fill="none" stroke="#247b86" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="356" font-size="28" fill="#486477" text-anchor="start" font-weight="400">02 / 运行期：由目标平台 JVM 完成</text><rect x="40" y="386" width="720" height="130" rx="16" fill="#e8f5f2" stroke="#a6bfca" stroke-width="2"/><text x="70" y="431" font-size="30" fill="#18344a" text-anchor="start" font-weight="600">加载 → 链接 → 初始化</text><text x="70" y="478" font-size="26" fill="#18344a" text-anchor="start" font-weight="400">解析可延后；初始化由特定使用触发</text><path d="M400 516 V560 H210 V603" fill="none" stroke="#247b86" stroke-width="3" marker-end="url(#arrow)"/><path d="M400 560 H590 V603" fill="none" stroke="#247b86" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="610" width="340" height="150" rx="16" fill="#e8f5f2" stroke="#a6bfca" stroke-width="2"/><rect x="420" y="610" width="340" height="150" rx="16" fill="#fff0d8" stroke="#a6bfca" stroke-width="2"/><text x="210" y="660" font-size="32" fill="#18344a" text-anchor="middle" font-weight="600">解释器</text><text x="210" y="708" font-size="26" fill="#18344a" text-anchor="middle" font-weight="400">解释执行字节码</text><text x="590" y="660" font-size="32" fill="#18344a" text-anchor="middle" font-weight="600">JIT 编译器</text><text x="590" y="708" font-size="26" fill="#18344a" text-anchor="middle" font-weight="400">热点 → 本地机器码</text><path d="M210 760 V803 H400 V840" fill="none" stroke="#247b86" stroke-width="3" marker-end="url(#arrow)"/><path d="M590 760 V803 H400" fill="none" stroke="#247b86" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="847" width="720" height="105" rx="16" fill="#e8f5f2" stroke="#a6bfca" stroke-width="2"/><text x="400" y="891" font-size="30" fill="#18344a" text-anchor="middle" font-weight="600">当前平台上的程序执行</text><text x="400" y="930" font-size="26" fill="#18344a" text-anchor="middle" font-weight="400">操作系统、CPU 与运行依赖</text><text x="40" y="1000" font-size="26" fill="#486477" text-anchor="start" font-weight="400">迁移前提：字节码版本、依赖与平台能力兼容。</text></g></svg>