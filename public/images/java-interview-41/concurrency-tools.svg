<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1300" viewBox="0 0 800 1300" role="img" aria-labelledby="title desc"><title id="title">可见性 ≠ 复合操作的原子性</title><desc id="desc">允许出现的 volatile 读改写交错导致丢失更新，并说明 volatile、原子计数和互斥锁的不同用途。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#247b86"/></marker></defs><rect width="800" height="1300" rx="20" fill="#fcfaf5"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="40" y="57" font-size="34" fill="#18344a" text-anchor="start" font-weight="700">可见性 ≠ 复合操作的原子性</text><text x="40" y="103" font-size="26" fill="#486477" text-anchor="start" font-weight="400">示例：volatile int count = 0；两线程各 count++</text><rect x="40" y="134" width="340" height="66" rx="16" fill="#e9eefb" stroke="#a6bfca" stroke-width="2"/><rect x="420" y="134" width="340" height="66" rx="16" fill="#e8f5f2" stroke="#a6bfca" stroke-width="2"/><text x="210" y="178" font-size="30" fill="#18344a" text-anchor="middle" font-weight="600">线程 A</text><text x="590" y="178" font-size="30" fill="#18344a" text-anchor="middle" font-weight="600">线程 B</text><text x="40" y="248" font-size="26" fill="#486477" text-anchor="start" font-weight="400">时间向下 ↓</text><path d="M40 322 H760" stroke="#d6dfdf" stroke-width="1"/><text x="210" y="300" font-size="28" fill="#18344a" text-anchor="middle" font-weight="400">读到 0</text><path d="M40 402 H760" stroke="#d6dfdf" stroke-width="1"/><text x="590" y="380" font-size="28" fill="#18344a" text-anchor="middle" font-weight="400">读到 0</text><path d="M40 482 H760" stroke="#d6dfdf" stroke-width="1"/><text x="210" y="460" font-size="28" fill="#18344a" text-anchor="middle" font-weight="400">计算 0 + 1</text><path d="M40 562 H760" stroke="#d6dfdf" stroke-width="1"/><text x="590" y="540" font-size="28" fill="#18344a" text-anchor="middle" font-weight="400">计算 0 + 1</text><path d="M40 642 H760" stroke="#d6dfdf" stroke-width="1"/><text x="210" y="620" font-size="28" fill="#18344a" text-anchor="middle" font-weight="400">写入 1</text><path d="M40 722 H760" stroke="#d6dfdf" stroke-width="1"/><text x="590" y="700" font-size="28" fill="#18344a" text-anchor="middle" font-weight="400">写入 1</text><rect x="40" y="748" width="720" height="85" rx="16" fill="#fff0d8" stroke="#a6bfca" stroke-width="2"/><text x="400" y="802" font-size="30" fill="#18344a" text-anchor="middle" font-weight="600">最终 count = 1：一次更新被覆盖</text><text x="40" y="895" font-size="30" fill="#18344a" text-anchor="start" font-weight="600">按需要维护的状态，选择同步机制</text><rect x="40" y="925" width="720" height="100" rx="16" fill="#e8f5f2" stroke="#a6bfca" stroke-width="2"/><text x="64" y="966" font-size="28" fill="#18344a" text-anchor="start" font-weight="600">volatile：状态标志、安全发布</text><text x="64" y="1005" font-size="26" fill="#18344a" text-anchor="start" font-weight="400">可见性约束；不让 count++ 自动变原子</text><rect x="40" y="1045" width="720" height="100" rx="16" fill="#e8f5f2" stroke="#a6bfca" stroke-width="2"/><text x="64" y="1086" font-size="28" fill="#18344a" text-anchor="start" font-weight="600">AtomicInteger：原子计数</text><text x="64" y="1125" font-size="26" fill="#18344a" text-anchor="start" font-weight="400">incrementAndGet() 完成原子读改写</text><rect x="40" y="1165" width="720" height="100" rx="16" fill="#e8f5f2" stroke="#a6bfca" stroke-width="2"/><text x="64" y="1206" font-size="28" fill="#18344a" text-anchor="start" font-weight="600">synchronized：复合操作与不变量</text><text x="64" y="1245" font-size="26" fill="#18344a" text-anchor="start" font-weight="400">相关读写共同遵守同一把锁的协议</text></g></svg>