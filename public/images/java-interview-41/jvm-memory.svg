<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1190" viewBox="0 0 800 1190" role="img" aria-labelledby="title desc"><title id="title">JVM 内存：先区分归属，再谈实现</title><desc id="desc">线程私有的计数器与栈，线程共享的 Java 堆，以及本地内存中的元空间和直接缓冲区。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#247b86"/></marker></defs><rect width="800" height="1190" rx="20" fill="#fcfaf5"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="40" y="57" font-size="34" fill="#18344a" text-anchor="start" font-weight="700">JVM 内存：先区分归属，再谈实现</text><text x="40" y="103" font-size="28" fill="#486477" text-anchor="start" font-weight="400">HotSpot / Java 17 常见实现视角</text><rect x="40" y="135" width="720" height="270" rx="16" fill="#e9eefb" stroke="#a6bfca" stroke-width="2"/><text x="64" y="181" font-size="30" fill="#18344a" text-anchor="start" font-weight="600">线程私有：每个线程各有一套</text><text x="64" y="241" font-size="28" fill="#18344a" text-anchor="start" font-weight="400">程序计数器：当前执行位置</text><text x="64" y="297" font-size="26" fill="#18344a" text-anchor="start" font-weight="400">虚拟机栈：栈帧、局部变量、操作数栈</text><text x="64" y="353" font-size="26" fill="#18344a" text-anchor="start" font-weight="400">本地方法栈：服务于 native 方法</text><rect x="40" y="440" width="720" height="220" rx="16" fill="#e8f5f2" stroke="#a6bfca" stroke-width="2"/><text x="64" y="487" font-size="30" fill="#18344a" text-anchor="start" font-weight="600">线程共享：Java 堆</text><text x="64" y="546" font-size="28" fill="#18344a" text-anchor="start" font-weight="400">对象实例、数组、字符串对象</text><text x="64" y="602" font-size="26" fill="#18344a" text-anchor="start" font-weight="400">Class 镜像及其中的静态字段值</text><rect x="40" y="695" width="720" height="180" rx="16" fill="#fff0d8" stroke="#a6bfca" stroke-width="2"/><text x="64" y="742" font-size="30" fill="#18344a" text-anchor="start" font-weight="600">本地内存：Metaspace</text><text x="64" y="797" font-size="26" fill="#18344a" text-anchor="start" font-weight="400">主要保存类元数据、运行时常量池等</text><text x="64" y="844" font-size="26" fill="#18344a" text-anchor="start" font-weight="400">对应方法区概念的一部分实现</text><rect x="40" y="910" width="720" height="150" rx="16" fill="#f1edf7" stroke="#a6bfca" stroke-width="2"/><text x="64" y="957" font-size="30" fill="#18344a" text-anchor="start" font-weight="600">堆外缓冲：直接内存</text><text x="64" y="1016" font-size="26" fill="#18344a" text-anchor="start" font-weight="400">如 DirectByteBuffer 使用的缓冲区</text><text x="40" y="1112" font-size="26" fill="#486477" text-anchor="start" font-weight="400">“方法区”是逻辑区域，不等于堆外全部内存。</text><text x="40" y="1157" font-size="26" fill="#486477" text-anchor="start" font-weight="400">堆是否分代、如何布局，取决于垃圾收集器。</text></g></svg>